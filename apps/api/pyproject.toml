[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "novalton-api"
version = "0.1.0"
description = "Novalton OS API foundation"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<0.116", "uvicorn[standard]>=0.34,<1.0"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1.0", "pytest>=8.3,<9.0", "ruff>=0.11,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/novalton_api"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
