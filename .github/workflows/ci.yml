name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: novalton_test
          POSTGRES_USER: novalton
          POSTGRES_PASSWORD: novalton_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novalton -d novalton_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NOVALTON_ENV: test
      DATABASE_URL: postgresql://novalton:novalton_test_only@127.0.0.1:5432/novalton_test
      NOVALTON_TEST_DATABASE_URL: postgresql://novalton:novalton_test_only@127.0.0.1:5432/novalton_test
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Check backend formatting and lint
        run: |
          status=0
          ruff format --check --diff . || status=1
          if ! ruff check .; then
            status=1
            ruff check --diff . || true
          fi
          exit "$status"
      - name: Verify disposable database contract
        run: |
          test "$NOVALTON_ENV" = test
          test "${DATABASE_URL##*/}" = novalton_test
          test "${NOVALTON_TEST_DATABASE_URL##*/}" = novalton_test
          test ! -e ../../.env.test
          test "$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc 'SELECT current_database()')" = novalton_test

      - name: Migrate disposable novalton_test database
        run: alembic -c alembic.ini upgrade head

      - name: Run full API suite on novalton_test
        run: |
          set -eu
          status=0
          for test_file in $(find tests -maxdepth 1 -type f -name 'test_*.py' | sort); do
            test "$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc 'SELECT current_database()')" = novalton_test
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
            alembic -c alembic.ini upgrade head
            python -m pytest -q "$test_file" || status=1
          done
          exit "$status"
      - run: pip-audit
  frontend:
    name: Frontend lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run test:lint
      - run: npm test --workspace @novalton/web
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Exercise operator login through Next and a local HTTPS OIDC issuer
        run: node apps/web/scripts/operator-oidc-smoke.mjs
      - run: npm audit --audit-level=high
  recovery-export:
    name: Verified Git recovery export
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/mission5-identity-capacity'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build and verify source archive and complete Git bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir recovery-export
          git branch mission5-export HEAD
          git bundle create recovery-export/Novalton_OS_Mission_5.bundle refs/heads/mission5-export
          git bundle verify recovery-export/Novalton_OS_Mission_5.bundle
          git clone --quiet --branch mission5-export recovery-export/Novalton_OS_Mission_5.bundle "$RUNNER_TEMP/mission5-restore"
          test "$(git rev-parse HEAD)" = "$(git -C "$RUNNER_TEMP/mission5-restore" rev-parse HEAD)"
          test "$(git rev-parse HEAD^{tree})" = "$(git -C "$RUNNER_TEMP/mission5-restore" rev-parse HEAD^{tree})"
          git archive --format=zip --prefix=novalton-os/ --output=recovery-export/Novalton_OS_Mission_5_Sources.zip HEAD
          git rev-parse HEAD > recovery-export/HEAD.txt
          git log --reverse --format='%H %s' 997bc8a0584e654199db8e672433380b180128b9..HEAD > recovery-export/COMMITS.txt
          if test -f docs/21-mission-5-handoff.md; then
            cp docs/21-mission-5-handoff.md recovery-export/MISSION_6_REPRISE.md
          fi
          cd recovery-export
          sha256sum Novalton_OS_Mission_5.bundle Novalton_OS_Mission_5_Sources.zip HEAD.txt COMMITS.txt > SHA256SUMS
          if test -f MISSION_6_REPRISE.md; then
            sha256sum MISSION_6_REPRISE.md >> SHA256SUMS
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Novalton_OS_Mission_5_${{ github.event.pull_request.head.sha || github.sha }}
          path: recovery-export/
          retention-days: 90
          if-no-files-found: error
