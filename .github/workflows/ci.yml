name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: novalton_test
          POSTGRES_USER: novalton
          POSTGRES_PASSWORD: novalton_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novalton -d novalton_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NOVALTON_ENV: test
      DATABASE_URL: postgresql://novalton:novalton_test_only@127.0.0.1:5432/novalton_test
      NOVALTON_TEST_DATABASE_URL: postgresql://novalton:novalton_test_only@127.0.0.1:5432/novalton_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: pip-audit
  frontend:
    name: Frontend lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high
