name: Cadrage graphical acceptance
on:
  pull_request:
permissions:
  contents: read
jobs:
  graphical:
    if: github.head_ref == 'feature/mission12b-intelligent-cadrage-byok' || github.head_ref == 'feature/mission12c-governed-launch-ai-quality' || github.head_ref == 'feature/mission12d-governed-execution-financial-authorization' || github.head_ref == 'feature/mission12e-atomic-governed-launch'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: novalton_test
          POSTGRES_USER: novalton
          POSTGRES_PASSWORD: novalton_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novalton -d novalton_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NOVALTON_ENV: test
      DATABASE_URL: postgresql://novalton:novalton_test_only@127.0.0.1:5432/novalton_test
      NOVALTON_TEST_DATABASE_URL: postgresql://novalton:novalton_test_only@127.0.0.1:5432/novalton_test
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: npm
      - name: Verify disposable PostgreSQL and runner browser
        run: |
          test "$NOVALTON_ENV" = test
          test "${DATABASE_URL##*/}" = novalton_test
          test "$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc 'SELECT current_database()')" = novalton_test
          command -v google-chrome
          command -v chromedriver
      - name: Install and migrate isolated application
        run: |
          python -m pip install -e apps/api
          npm ci
          npm run build --workspace @novalton/web
          alembic -c apps/api/alembic.ini upgrade head
      - name: Initialize disposable owner without HTTP bootstrap
        run: |
          password="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$password"
          echo "NOVALTON_E2E_PASSWORD=$password" >> "$GITHUB_ENV"
          NOVALTON_E2E_PASSWORD="$password" python - <<'PY'
          import asyncio
          import os
          from novalton_api.core.config import get_settings
          from novalton_api.core.database import Database, verify_database_identity
          from novalton_api.modules.local_auth.bootstrap import bootstrap_owner

          async def initialize():
              settings = get_settings()
              await verify_database_identity(settings)
              db = Database.from_settings(settings)
              try:
                  async with db.session_factory.begin() as session:
                      await bootstrap_owner(session, settings=settings, login="graphical-owner",
                                            password=os.environ["NOVALTON_E2E_PASSWORD"])
              finally:
                  await db.dispose()

          asyncio.run(initialize())
          PY
      - name: Exercise real Chrome desktop and mobile paths
        run: python apps/web/scripts/graphical-acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission12b-graphical-${{ github.sha }}
          path: ${{ runner.temp }}/novalton-graphical/*.png
          retention-days: 14
          if-no-files-found: ignore
