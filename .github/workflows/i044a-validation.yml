name: I-044A validation

on:
  push:
    branches:
      - ci/i044a-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-api:
    name: Source contracts and disposable API database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: novalton_test
          POSTGRES_USER: novalton_ci
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novalton_ci -d novalton_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NOVALTON_ENV: test
      DATABASE_URL: postgresql://novalton_ci:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/novalton_test
      NOVALTON_TEST_DATABASE_URL: postgresql://novalton_ci:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/novalton_test
      PYTHONNOUSERSITE: "1"
      GITHUB_TOKEN: ""
      OPENAI_API_KEY: ""
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install API test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'apps/api[dev]'

      - name: Verify disposable database contract
        run: |
          test "$NOVALTON_ENV" = test
          test "${DATABASE_URL##*/}" = novalton_test
          test "${NOVALTON_TEST_DATABASE_URL##*/}" = novalton_test
          test ! -e .env.test

      - name: Run focused sandbox adapter tests
        run: python -m pytest -q apps/api/tests/test_verification_sandbox.py

      - name: Migrate disposable novalton_test database
        run: alembic -c apps/api/alembic.ini upgrade head

      - name: Run full API suite on novalton_test
        run: |
          set -eu
          status=0
          for test_file in $(find apps/api/tests -maxdepth 1 -type f -name 'test_*.py' | sort); do
            test "$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc 'SELECT current_database()')" = novalton_test
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
            alembic -c apps/api/alembic.ini upgrade head
            python -m pytest -q "$test_file" || status=1
          done
          exit "$status"

      - name: Run I-044A source and staging acceptance
        if: ${{ always() }}
        run: |
          python -I -S -B infra/verification/i044b-v2/tests/test_i044b_contract.py
          python -I -S -B infra/verification/i044a-v2/tests/test_i044a_contract.py
          python -I -S -B infra/verification/i044a-v2/tests/test_i044a_seccomp_staging.py

      - name: Verify I-044A bundle closure and reviewed runtime pin
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import importlib.util
          import hashlib
          import json
          import tarfile
          from pathlib import Path

          root = Path("infra/verification/i044a-v2")
          spec = importlib.util.spec_from_file_location("i044a_installer", root / "install.py")
          installer = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(installer)
          loaded = installer.load_bundle(root / "bundle.tar")
          with tarfile.open(root / "bundle.tar", "r:") as archive:
              names = {member.name for member in archive.getmembers()}
          assert names == {"bundle-manifest.json", *installer.FILES.values(), *installer.AUXILIARY.values()}
          assert set(loaded) == set(installer.FILES)
          manifest = json.loads((root / "bundle-manifest.json").read_bytes())
          for destination, source in (installer.FILES | installer.AUXILIARY).items():
              assert hashlib.sha256((root / source).read_bytes()).hexdigest() == manifest[destination]
          assert installer.FOUNDATION_INPUT_SHA256 == "ff6e291f4eccac450fd72c5ed40ecbfff06b6704f922e9ba764811045ca07660"
          assert installer.I044A_INPUT_SHA256 == "b244ee9fca0be5024f1a000ea23199f816ac52ad265bde4cd5e42373faa897d8"
          PY

      - name: Lint I-044A and sandbox files
        if: ${{ always() }}
        run: |
          ruff check \
            apps/api/src/novalton_api/infrastructure/verification_sandbox.py \
            apps/api/tests/test_verification_sandbox.py \
            infra/verification/i044a-v2/install.py \
            infra/verification/i044a-v2/tests/accept_i044a_installed.py \
            infra/verification/i044a-v2/tests/test_i044a_contract.py \
            infra/verification/i044a-v2/tests/test_i044a_seccomp_kernel.py \
            infra/verification/i044a-v2/worker/i044a.py \
            infra/verification/i044b-v2/provision.py \
            infra/verification/i044b-v2/tests/accept_i044b_installed.py \
            infra/verification/i044b-v2/tests/test_i044b_contract.py \
            infra/verification/i044b-v2/worker/worker.py

      - name: Check shell syntax and patch whitespace
        if: ${{ always() }}
        run: |
          sh -n infra/verification/i044a-v2/root-handoff.sh
          bash -n infra/verification/i044a-v2/root-handoff.sh
          sh -n infra/verification/i044b-v2/root-handoff.sh
          bash -n infra/verification/i044b-v2/root-handoff.sh
          git diff --check HEAD^ HEAD

  i044b-foundation:
    name: Reproducible I-044B foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned I-044B build prerequisites
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install --yes build-essential curl libffi-dev pkg-config

      - name: Build and install the reviewed I-044B v2 foundation
        run: |
          set -eu
          stage=/run/novalton-i044b-v2-reviewed
          input=/run/novalton-i044b-v2-input
          test ! -e "$stage"
          sudo install -d -o root -g root -m 0500 "$stage" "$input" "$input/worker" "$input/client" "$input/tests"
          sudo install -o root -g root -m 0400 infra/verification/i044b-v2/provision.py "$input/provision.py"
          sudo install -o root -g root -m 0400 infra/verification/i044b-v2/foundation-input.json "$input/foundation-input.json"
          sudo install -o root -g root -m 0400 infra/verification/i044b-v2/runtime.lock.json "$input/runtime.lock.json"
          sudo install -o root -g root -m 0400 infra/verification/i044b-v2/novalton-verification.service "$input/novalton-verification.service"
          sudo install -o root -g root -m 0400 'infra/verification/i044b-v2/var-lib-novalton\x2dverification.mount' "$input/var-lib-novalton\\x2dverification.mount"
          sudo install -o root -g root -m 0400 infra/verification/i044b-v2/worker/worker.py "$input/worker/worker.py"
          sudo install -o root -g root -m 0400 infra/verification/i044b-v2/client/i044b_client.py "$input/client/i044b_client.py"
          sudo install -o root -g root -m 0400 infra/verification/i044b-v2/tests/accept_i044b_installed.py "$input/tests/accept_i044b_installed.py"
          sudo install -o root -g root -m 0400 infra/verification/i044b-v2/root-handoff.sh "$stage/root-handoff.sh"
          sudo sha256sum -c <<'EOF'
          d1a4f52aee046af5ecb601978789bfad5f6ed97bc97e2073bea907b7ae5984cd  /run/novalton-i044b-v2-reviewed/root-handoff.sh
          EOF
          sudo /bin/sh "$stage/root-handoff.sh"

      - name: Verify exact I-044B v2 identity
        run: |
          set -eu
          expected=ff6e291f4eccac450fd72c5ed40ecbfff06b6704f922e9ba764811045ca07660
          base=/opt/novalton-verification/i044b-v2
          test -d "$base"
          test ! -L "$base"
          test "$(sudo sha256sum "$base/foundation-input.json" | awk '{print $1}')" = "$expected"
          sudo "$base/runtime/bin/python3.13" -I -S -B "$base/tests/accept_i044b_installed.py"

  installed-i044a:
    name: Installed I-044A kernel and acceptance
    needs:
      - source-and-api
      - i044b-foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install I-044A through the reviewed handoff
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install --yes build-essential curl libffi-dev pkg-config
          bstage=/run/novalton-i044b-v2-reviewed
          binput=/run/novalton-i044b-v2-input
          sudo install -d -o root -g root -m 0500 "$bstage" "$binput" "$binput/worker" "$binput/client" "$binput/tests"
          sudo install -o root -g root -m 0400 infra/verification/i044b-v2/provision.py "$binput/provision.py"
          sudo install -o root -g root -m 0400 infra/verification/i044b-v2/foundation-input.json "$binput/foundation-input.json"
          sudo install -o root -g root -m 0400 infra/verification/i044b-v2/runtime.lock.json "$binput/runtime.lock.json"
          sudo install -o root -g root -m 0400 infra/verification/i044b-v2/novalton-verification.service "$binput/novalton-verification.service"
          sudo install -o root -g root -m 0400 'infra/verification/i044b-v2/var-lib-novalton\x2dverification.mount' "$binput/var-lib-novalton\\x2dverification.mount"
          sudo install -o root -g root -m 0400 infra/verification/i044b-v2/worker/worker.py "$binput/worker/worker.py"
          sudo install -o root -g root -m 0400 infra/verification/i044b-v2/client/i044b_client.py "$binput/client/i044b_client.py"
          sudo install -o root -g root -m 0400 infra/verification/i044b-v2/tests/accept_i044b_installed.py "$binput/tests/accept_i044b_installed.py"
          sudo install -o root -g root -m 0400 infra/verification/i044b-v2/root-handoff.sh "$bstage/root-handoff.sh"
          sudo sha256sum -c <<'EOF'
          d1a4f52aee046af5ecb601978789bfad5f6ed97bc97e2073bea907b7ae5984cd  /run/novalton-i044b-v2-reviewed/root-handoff.sh
          EOF
          sudo /bin/sh "$bstage/root-handoff.sh"
          # This root-owned static source is the only path admitted by the
          # installed I-044A unit.  It is not the checkout and contains no
          # provider credentials, VCS data, or caller-controlled symlinks.
          sudo install -d -o root -g root -m 0555 /var/lib/novalton-verification/source/workspace
          sudo install -o root -g root -m 0444 apps/api/tests/sandbox_fixtures/adversarial_data.txt /var/lib/novalton-verification/source/workspace/reviewed-data.txt
          stage=/run/novalton-i044a-v2-reviewed
          source=/run/novalton-i044a-v2-input
          sudo install -d -o root -g root -m 0500 "$source"
          sudo install -o root -g root -m 0400 infra/verification/i044a-v2/install.py "$source/install.py"
          sudo install -o root -g root -m 0400 infra/verification/i044a-v2/bundle.tar "$source/bundle.tar"
          test ! -e "$stage"
          sudo install -d -o root -g root -m 0500 "$stage"
          sudo install -o root -g root -m 0400 infra/verification/i044a-v2/root-handoff.sh "$stage/root-handoff.sh"
          sudo sha256sum -c <<'EOF'
          e4fc39a9a934a09f1f2b976e92c786d1f177e7b545abd0f9d85aae487a046792  /run/novalton-i044a-v2-reviewed/root-handoff.sh
          EOF
          sudo /bin/sh "$stage/root-handoff.sh"

      - name: Verify installed identity separation and closure
        run: |
          sudo /opt/novalton-verification/i044a-v2/rootfs/runtime/bin/python3.13 -I -S -B - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          base = Path("/opt/novalton-verification/i044b-v2")
          release = Path("/opt/novalton-verification/i044a-v2")
          foundation = json.loads((base / "foundation-metadata.json").read_bytes())
          metadata = json.loads((release / "release-metadata.json").read_bytes())
          assert foundation["foundation_input_sha256"] == "ff6e291f4eccac450fd72c5ed40ecbfff06b6704f922e9ba764811045ca07660"
          assert foundation["installed_manifest_sha256"] == hashlib.sha256((base / "installed-manifest.json").read_bytes()).hexdigest()
          assert metadata["i044a_input_sha256"] == "b244ee9fca0be5024f1a000ea23199f816ac52ad265bde4cd5e42373faa897d8"
          assert metadata["foundation_input_sha256"] == foundation["foundation_input_sha256"]
          assert metadata["foundation_installed_manifest_sha256"] == foundation["installed_manifest_sha256"]
          assert metadata["installed_manifest_sha256"] == hashlib.sha256((release / "manifest.json").read_bytes()).hexdigest()
          PY

      - name: Run installed kernel seccomp acceptance
        run: sudo /opt/novalton-verification/i044a-v2/rootfs/runtime/bin/python3.13 -I -S -B /run/novalton-i044a-v2-reviewed/tests/test_i044a_seccomp_kernel.py

      - name: Run installed I-044A acceptance
        run: sudo /opt/novalton-verification/i044a-v2/rootfs/runtime/bin/python3.13 -I -S -B /run/novalton-i044a-v2-reviewed/tests/accept_i044a_installed.py
